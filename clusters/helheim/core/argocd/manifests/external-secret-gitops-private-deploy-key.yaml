---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-gitops-private
  namespace: argocd
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical-secret-store
  refreshInterval: "1h"
  target:
    name: repo-gitops-private
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        # must match repoURL in root-private.yaml and the apps it bootstraps, verbatim
        url: git@github.com:MichielVanHerreweghe/gitops-private.git
        # trim + explicit \n: SSH rejects a key whose trailing newline the Infisical UI ate
        sshPrivateKey: "{{ .sshPrivateKey | trim }}\n"
  data:
    - secretKey: sshPrivateKey
      remoteRef:
        key: GITOPS_PRIVATE_DEPLOY_KEY
