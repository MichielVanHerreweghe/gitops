apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    external-dns.alpha.kubernetes.io/controller: none
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
  hostnames:
    - "argocd.houseofix.online"
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
